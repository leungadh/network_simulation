apiVersion: 1

datasources:
  - name: ClickHouse
    uid: netsim-ch
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: ${CLICKHOUSE_USER:-netsim}
      defaultDatabase: netsim
      tlsSkipVerify: true
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD:-netsim}
    editable: false
