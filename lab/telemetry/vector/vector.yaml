# Stage 2 ingestion.
#
# Replaces the Stage 1 Python syslog sink. Two inputs, one destination:
#   cSRX RT_FLOW syslog  -> netsim.flows
#   out/intents.jsonl    -> netsim.intents
#
# RUN_ID is read from the environment at startup. `make traffic` recreates this
# container along with the engine so both halves of the ground truth carry the
# same run id — they were minted separately once, and the two sides could never
# be correlated.

data_dir: /var/lib/vector

sources:
  # Raw UDP rather than the syslog source: cSRX emits RFC5424 with a Juniper
  # SD-ID, and parsing the key="value" payload explicitly is more predictable
  # than relying on structured-data auto-extraction.
  csrx_syslog:
    type: socket
    mode: udp
    address: 0.0.0.0:514
    max_length: 65535
    decoding:
      codec: bytes

  intents_file:
    type: file
    include:
      - /out/intents.jsonl
    read_from: beginning
    fingerprint:
      strategy: device_and_inode

transforms:
  parse_flows:
    type: remap
    inputs: [csrx_syslog]
    drop_on_error: true
    reroute_dropped: true
    source: |
      raw = string!(.message)

      if contains(raw, "RT_FLOW_SESSION_CLOSE") {
        .event_type = "session_close"
      } else if contains(raw, "RT_FLOW_SESSION_CREATE") {
        .event_type = "session_create"
      } else {
        abort
      }

      # Prefer the firewall's own timestamp. The join window is 5s, and
      # receive-time jitter eats into it.
      hdr = parse_regex(raw, r'^<\d+>\d\s+(?P<t>\S+)') ?? {}
      stamp = now()
      if exists(hdr.t) {
        stamp = to_timestamp(string!(hdr.t)) ?? now()
      }
      .ts = format_timestamp!(stamp, "%Y-%m-%d %H:%M:%S%.3f")

      # RT_FLOW structured-data is a flat list of key="value" pairs.
      pairs = parse_regex_all(raw, r'(?P<k>[A-Za-z0-9\-_]+)="(?P<v>[^"]*)"') ?? []
      kv = {}
      for_each(pairs) -> |_i, m| {
        kv = set!(kv, [string!(m.k)], string!(m.v))
      }

      .run_id       = "${RUN_ID:-unknown}"
      .src_ip       = get(kv, ["source-address"])      ?? "0.0.0.0"
      .dst_ip       = get(kv, ["destination-address"]) ?? "0.0.0.0"
      .src_port     = to_int(get(kv, ["source-port"])      ?? "0") ?? 0
      .dst_port     = to_int(get(kv, ["destination-port"]) ?? "0") ?? 0

      proto = get(kv, ["protocol-id"]) ?? ""
      .protocol = if proto == "6"  { "TCP" }
             else if proto == "17" { "UDP" }
             else if proto == "1"  { "ICMP" }
             else { proto }

      .application  = get(kv, ["application"])             ?? ""
      .nested_app   = get(kv, ["nested-application"])      ?? ""
      .policy_name  = get(kv, ["policy-name"])             ?? ""
      .src_zone     = get(kv, ["source-zone-name"])        ?? ""
      .dst_zone     = get(kv, ["destination-zone-name"])   ?? ""
      .reason       = get(kv, ["reason"])                  ?? ""

      .bytes_in     = to_int(get(kv, ["bytes-from-client"])   ?? "0") ?? 0
      .bytes_out    = to_int(get(kv, ["bytes-from-server"])   ?? "0") ?? 0
      .packets_in   = to_int(get(kv, ["packets-from-client"]) ?? "0") ?? 0
      .packets_out  = to_int(get(kv, ["packets-from-server"]) ?? "0") ?? 0

      # RT_FLOW reports elapsed time in seconds; the schema stores milliseconds.
      .duration_ms  = (to_int(get(kv, ["elapsed-time"]) ?? "0") ?? 0) * 1000

      sid = get(kv, ["session-id-32"]) ?? (get(kv, ["session-id"]) ?? "0")
      .session_id   = to_int(sid) ?? 0

      .nat_src_ip   = get(kv, ["nat-source-address"]) ?? "0.0.0.0"
      .nat_src_port = to_int(get(kv, ["nat-source-port"]) ?? "0") ?? 0

      del(.message)
      del(.timestamp)
      del(.host)
      del(.source_type)
      del(.port)

  parse_intents:
    type: remap
    inputs: [intents_file]
    drop_on_error: true
    reroute_dropped: true
    source: |
      obj = parse_json!(string!(.message))

      .run_id           = string(obj.run_id)   ?? "unknown"
      .schema_version   = to_int(obj.schema_version) ?? 1

      stamp = to_timestamp(string!(obj.ts)) ?? now()
      .ts = format_timestamp!(stamp, "%Y-%m-%d %H:%M:%S%.3f")

      .worker_id        = to_int(obj.worker_id) ?? 0
      .worker_name      = string(obj.worker_name) ?? ""
      .persona          = string(obj.persona) ?? ""
      .src_ip           = string(obj.src_ip) ?? "0.0.0.0"
      .src_port         = to_int(obj.src_port) ?? 0
      .dst_host         = string(obj.dst_host) ?? ""
      .dst_ip           = string(obj.dst_ip) ?? "0.0.0.0"
      .dst_port         = to_int(obj.dst_port) ?? 0
      .activity         = string(obj.activity) ?? ""
      .protocol_adapter = string(obj.protocol_adapter) ?? ""
      .label            = string(obj.label) ?? "benign"
      .attack_family    = string(obj.attack_family) ?? ""
      .bytes_intended   = to_int(obj.bytes_intended) ?? 0
      .bytes_received   = to_int(obj.bytes_received) ?? 0
      .duration_ms      = to_int(obj.duration_ms) ?? 0
      .ok               = if (obj.ok == true) { 1 } else { 0 }
      .error            = string(obj.error) ?? ""

      del(.message)
      del(.timestamp)
      del(.host)
      del(.source_type)
      del(.file)

sinks:
  clickhouse_flows:
    type: clickhouse
    inputs: [parse_flows]
    endpoint: http://clickhouse:8123
    database: netsim
    table: flows
    auth:
      strategy: basic
      user: ${CLICKHOUSE_USER:-netsim}
      password: ${CLICKHOUSE_PASSWORD:-netsim}
    skip_unknown_fields: true
    date_time_best_effort: true
    batch:
      max_events: 500
      timeout_secs: 2
    healthcheck:
      enabled: true

  clickhouse_intents:
    type: clickhouse
    inputs: [parse_intents]
    endpoint: http://clickhouse:8123
    database: netsim
    table: intents
    auth:
      strategy: basic
      user: ${CLICKHOUSE_USER:-netsim}
      password: ${CLICKHOUSE_PASSWORD:-netsim}
    skip_unknown_fields: true
    date_time_best_effort: true
    batch:
      max_events: 500
      timeout_secs: 2
    healthcheck:
      enabled: true

  # Raw archive. Independent of parsing, so a VRL bug never loses the source
  # data — the Stage 1 sink's one genuine advantage was that the raw log
  # survived whatever the parser did.
  raw_archive:
    type: file
    inputs: [csrx_syslog]
    path: /out/syslog_raw.log
    encoding:
      codec: text

  # Anything the transforms rejected, kept visible rather than dropped.
  parse_failures:
    type: file
    inputs: [parse_flows.dropped, parse_intents.dropped]
    path: /out/parse_failures.log
    encoding:
      codec: json
