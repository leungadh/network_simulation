# Stage 1 — walking skeleton
#
#   3 workers -> br-ns-trust -> cSRX -> br-ns-untrust -> nginx (TLS)
#                                  |
#                            br-ns-mgmt -> syslog sink
#
# Containers and bridges are prefixed so this lab can coexist with others on
# the same host — bare names like "csrx" or "web" collide.
#
# Goal: prove one flow end to end with correct worker attribution.
# Deliberately minimal. No NAT, no personas, no ClickHouse.

name: netsim

networks:
  # Management. cSRX fxp0 lives here and sends syslog to the sink.
  #
  # MGMT_INTERNAL=false gives this bridge egress so cSRX can reach
  # signatures.juniper.net to download the AppID database. ONLY this bridge —
  # trust and untrust stay internal, so the simulated data plane still cannot
  # reach the real internet and the lab's isolation guarantee holds.
  # Egress needs BOTH of these: internal=false to get a default route, and
  # masquerade=true so replies can find their way back. Setting only one gives
  # a container that can send and never receive. The Makefile derives both from
  # MGMT_EGRESS in .env so they cannot drift apart.
  mgmt:
    driver: bridge
    internal: ${MGMT_INTERNAL:-true}
    ipam:
      config:
        - subnet: ${MGMT_PREFIX:-172.30.0}.0/24
          # Docker would otherwise take .1 — the address cSRX needs.
          gateway: ${MGMT_PREFIX:-172.30.0}.254
    driver_opts:
      com.docker.network.bridge.name: br-ns-mgmt
      com.docker.network.bridge.enable_ip_masquerade: "${MGMT_MASQUERADE:-false}"

  # Trust zone. Workers live here.
  # TRUST_PREFIX is the first TWO octets; the worker allocator uses the third
  # octet to scale past 254 workers, so this must stay a /16.
  trust:
    driver: bridge
    internal: true          # guarantees no real-internet egress
    ipam:
      config:
        - subnet: ${TRUST_PREFIX:-10.20}.0.0/16
          # The docker bridge is pushed to the top of the range so cSRX can own
          # .0.1 and act as the real gateway. These networks are internal, so
          # the bridge address routes nowhere and is never used.
          gateway: ${TRUST_PREFIX:-10.20}.255.254
    driver_opts:
      com.docker.network.bridge.name: br-ns-trust
      com.docker.network.bridge.enable_ip_masquerade: "false"

  # Untrust zone — the "fake internet". TEST-NET-3, unroutable by design.
  untrust:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${UNTRUST_PREFIX:-203.0.113}.0/24
          gateway: ${UNTRUST_PREFIX:-203.0.113}.254
    driver_opts:
      com.docker.network.bridge.name: br-ns-untrust
      com.docker.network.bridge.enable_ip_masquerade: "false"

# NOTE: cSRX is deliberately NOT a service here. Docker does not guarantee the
# order networks are attached at container creation, and cSRX maps interfaces
# positionally (eth0=fxp0, eth1=ge-0/0/0, eth2=ge-0/0/1). csrx/launch.sh starts
# it on management alone and connects the data networks one at a time, then
# verifies the mapping. See "Interface ordering" in README.md.

  # Telemetry plane: ClickHouse, Vector, Grafana.
  #
  # NOT internal, deliberately. Grafana installs its ClickHouse datasource
  # plugin on first start, and published ports do not work on an internal
  # network. This is infrastructure, not the simulated data plane — trust and
  # untrust stay sealed, so the simulation still cannot reach or leak to the
  # real internet.
  telemetry:
    driver: bridge
    ipam:
      config:
        - subnet: ${TELEMETRY_PREFIX:-172.32.0}.0/24
          gateway: ${TELEMETRY_PREFIX:-172.32.0}.254
    driver_opts:
      com.docker.network.bridge.name: br-ns-tlm

services:

  # ---------------------------------------------------------------
  # Syslog sink. Receives RT_FLOW from cSRX, writes raw + parsed CSV.
  # Stage 2 replaces this with Vector -> ClickHouse.
  # ---------------------------------------------------------------
  # Stage 1's Python sink. Superseded by Vector, kept behind a profile because
  # it is a useful fallback when debugging a VRL change:
  #     docker compose --profile legacy up -d syslog-sink
  # It binds .21 so it can run alongside Vector without fighting for .20.
  syslog-sink:
    profiles: [legacy]
    build: ./telemetry
    container_name: netsim-syslog-sink
    networks:
      mgmt:
        ipv4_address: ${MGMT_PREFIX:-172.30.0}.21
    volumes:
      - ./out:/out
    environment:
      RUN_ID: ${RUN_ID:-stage1-dev}

  # ---------------------------------------------------------------
  # Telemetry spine
  # ---------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: netsim-clickhouse
    networks:
      telemetry:
        ipv4_address: ${TELEMETRY_PREFIX:-172.32.0}.10
    ports:
      # Host-only: verify.py queries this from outside the containers.
      - "127.0.0.1:8123:8123"
    volumes:
      - ./telemetry/clickhouse:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      # clickhouse-client ships in the image; wget does not necessarily, and a
      # missing binary makes the check fail forever — the container then sits
      # in "starting" until retries exhaust, which looks like a startup hang.
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  vector:
    image: timberio/vector:0.41.1-alpine
    container_name: netsim-vector
    networks:
      mgmt:
        # cSRX sends syslog here; the address must match bootstrap.set.
        ipv4_address: ${MGMT_PREFIX:-172.30.0}.20
      telemetry:
        ipv4_address: ${TELEMETRY_PREFIX:-172.32.0}.20
    volumes:
      - ./telemetry/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./out:/out
      - vector-data:/var/lib/vector
    environment:
      RUN_ID: ${RUN_ID:-stage1-dev}
      VECTOR_LOG: ${VECTOR_LOG:-info}
    depends_on:
      clickhouse:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    container_name: netsim-grafana
    networks:
      telemetry:
        ipv4_address: ${TELEMETRY_PREFIX:-172.32.0}.30
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Installed on first start — needs egress, which is why the telemetry
      # network is not internal.
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    depends_on:
      clickhouse:
        condition: service_healthy

  # ---------------------------------------------------------------
  # The "internet" — one TLS site for now.
  # ---------------------------------------------------------------
  web:
    build: ./internet
    container_name: netsim-web
    networks:
      untrust:
        ipv4_address: ${UNTRUST_PREFIX:-203.0.113}.10
    cap_add:
      - NET_ADMIN            # needed to add the return route via cSRX
    environment:
      RETURN_ROUTE: "${TRUST_PREFIX:-10.20}.0.0/16 via ${UNTRUST_PREFIX:-203.0.113}.1"
    volumes:
      - ./pki:/pki:ro

  # ---------------------------------------------------------------
  # Workstation — hosts all 3 workers as coroutines, one source IP each.
  # A worker is NOT a container. See plan section 4.1.
  # ---------------------------------------------------------------
  workstation:
    build: ./workstation
    container_name: netsim-workstation
    networks:
      trust:
        ipv4_address: ${TRUST_PREFIX:-10.20}.0.100
    cap_add:
      - NET_ADMIN            # to add per-worker secondary IPs
    environment:
      RUN_ID: ${RUN_ID:-stage1-dev}
      SEED: ${SEED:-1337}
      WORKER_COUNT: ${WORKER_COUNT:-3}
      TARGET_HOST: ${TARGET_HOST:-www.example-corp.internal}
      TARGET_IP: "${UNTRUST_PREFIX:-203.0.113}.10"
      GATEWAY: "${TRUST_PREFIX:-10.20}.0.1"
      TRUST_PREFIX: "${TRUST_PREFIX:-10.20}"
      DURATION_S: ${DURATION_S:-300}
    volumes:
      - ./out:/out
      - ./pki:/pki:ro
    depends_on:
      web:
        condition: service_started

volumes:
  clickhouse-data:
  vector-data:
  grafana-data:
