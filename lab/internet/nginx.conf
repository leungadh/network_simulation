worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log the client address so we can cross-check worker attribution
    # independently of the firewall.
    log_format  attributed  '$remote_addr:$remote_port -> $server_name '
                            '"$request" $status $body_bytes_sent '
                            'ssl="$ssl_protocol/$ssl_cipher" sni="$ssl_server_name"';
    access_log  /var/log/nginx/access.log  attributed;

    sendfile        on;
    keepalive_timeout  15;

    # Plain HTTP — kept so Stage 1 can compare classified HTTP vs HTTPS in AppID.
    server {
        listen       80 default_server;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;
    }

    # TLS. Certificate is issued by the lab's private CA, which the workers
    # trust. Keeping our own CA means adding SSL forward proxy at Stage 6 is a
    # config change rather than a redesign.
    server {
        listen       443 ssl default_server;
        server_name  www.example-corp.internal;

        ssl_certificate      /pki/server.crt;
        ssl_certificate_key  /pki/server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;

        root   /usr/share/nginx/html;
        index  index.html;

        # A few endpoints with different response sizes, so Stage 1 produces
        # varied byte counts rather than one repeated flow shape.
        location /small  { return 200 "ok\n"; }
        location /medium { alias /usr/share/nginx/html/medium.bin; }
        location /large  { alias /usr/share/nginx/html/large.bin; }

        # Accepts uploads, so we can exercise the asymmetric-byte-count path
        # that Stage 5's exfiltration detection depends on.
        location /upload {
            client_max_body_size 64m;
            return 204;
        }
    }
}
